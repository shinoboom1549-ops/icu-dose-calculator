<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>ICU 投与速度計算</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef3f7;color:#10263b;margin:0;padding:env(safe-area-inset-top) 16px 40px}main{max-width:560px;margin:auto}h1{font-size:24px;margin:24px 0 4px}.sub{color:#637486;font-size:13px}.panel{background:white;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 3px 18px #14263a12}label{display:block;font-size:13px;font-weight:650;margin:14px 0 5px}input,select{width:100%;box-sizing:border-box;border:1px solid #cbd5df;border-radius:11px;padding:12px;font-size:17px;background:white;color:#10263b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#10263b;color:white;border-radius:18px;padding:22px;margin-top:16px;text-align:center}.result small{display:block;color:#b9cfdf}.result strong{font-size:42px;display:block;margin:8px 0}.note{font-size:12px;color:#657587;line-height:1.6}button{border:0;border-radius:10px;padding:11px 15px;background:#e0eaf2;color:#123b59;font-weight:700}#steps{font-size:14px;line-height:1.8}</style></head><body><main><h1>ICU 投与速度計算</h1><div class="sub">単位を揃えて mL/h に換算するツール</div><div class="panel"><label>薬剤（選択すると投与単位が自動で切り替わります）</label><select id="drug"><option value="ugkgmin">ノルアドレナリン</option><option value="ugkgmin">ドブタミン</option><option value="ugkgmin">アドレナリン</option><option value="ugkgmin">レミフェンタニル</option><option value="ugkgh">デクスメデトミジン</option><option value="mgkgh">プロポフォール</option><option value="ugh">フェンタニル</option><option value="mgkgh">ロクロニウム</option><option value="uh">ヘパリン / インスリン</option><option value="umin">バソプレシン</option><option value="ugkgmin">その他（単位を選択）</option></select><div class="grid"><div><label>体重 kg</label><input id="weight" type="number" inputmode="decimal" value="60" min="0" step="any"></div><div><label>投与単位</label><select id="unit"><option value="ugkgmin">μg/kg/min (γ)</option><option value="ugkgh">μg/kg/h</option><option value="mgkgh">mg/kg/h</option><option value="ugmin">μg/min</option><option value="mgmin">mg/min</option><option value="ugh">μg/h</option><option value="mgh">mg/h</option><option value="uh">U/h</option><option value="umin">U/min</option></select></div></div><label>目標投与量（選択した単位）</label><input id="dose" type="number" inputmode="decimal" value="0.1" min="0" step="any"><div class="grid"><div><label>薬剤総量</label><input id="amount" type="number" inputmode="decimal" value="4" min="0" step="any"></div><div><label>総量の単位</label><select id="mass"><option value="mg">mg</option><option value="ug">μg</option><option value="U">U</option></select></div><div><label>最終液量 mL</label><input id="volume" type="number" inputmode="decimal" value="50" min="0" step="any"></div><div><label>逆算用 流速 mL/h</label><input id="reverse" type="number" inputmode="decimal" placeholder="任意" min="0" step="any"></div></div></div><div class="result"><small>計算上の流速</small><strong id="answer">4.5 mL/h</strong><small id="reverseResult"></small></div><div class="panel"><b>計算過程</b><div id="steps"></div></div><p class="note">計算・学習用。薬剤の投与量や希釈法を推奨するものではありません。実投与前に薬剤名、製剤濃度、最終液量、投与経路、患者体重、施設プロトコルを確認し、独立した検算を行ってください。計算結果は小数第3位まで表示します。</p></main><script>const $=x=>document.getElementById(x),ids=['drug','weight','unit','dose','amount','mass','volume','reverse'];function calc(){const unit=$('unit').value,mass=$('mass').value,w=+$('weight').value,d=+$('dose').value,a=+$('amount').value,v=+$('volume').value;const isU=unit==='uh'||unit==='umin';const valid=Number.isFinite(w)&&w>0&&Number.isFinite(d)&&d>=0&&a>0&&v>0&&(isU===(mass==='U'));if(!valid){$('answer').textContent='入力・単位を確認';$('steps').textContent='正の体重・薬剤量・最終液量と、整合する質量単位を指定してください。';$('reverseResult').textContent='';return}let q=d;if(unit.includes('kg'))q*=w;if(unit.endsWith('min'))q*=60;let unitLabel=isU?'U':unit.startsWith('mg')?'mg':'μg';let total=mass==='mg'?a*1000:mass==='ug'?a:a;let c=isU?a/v:unitLabel==='mg'?total/1000/v:total/v;let rate=q/c;let fmt=n=>Number(n.toPrecision(7)).toLocaleString('ja-JP',{maximumFractionDigits:5});$('answer').textContent=fmt(rate)+' mL/h';$('steps').textContent=`投与量 ${fmt(q)} ${unitLabel}/h ÷ 濃度 ${fmt(c)} ${unitLabel}/mL = ${fmt(rate)} mL/h`;let r=$('reverse').value;if(r!==''&&+r>=0){let back=(+r*c)/(unit.includes('kg')?w:1)/(unit.endsWith('min')?60:1);$('reverseResult').textContent=`${r} mL/h → ${fmt(back)} ${$('unit').selectedOptions[0].textContent}`}else $('reverseResult').textContent='';}$('drug').addEventListener('change',()=>{$('unit').value=$('drug').value;$('mass').value=['uh','umin'].includes($('unit').value)?'U':$('unit').value.startsWith('mg')?'mg':'mg';$('dose').value='';$('amount').value='';$('reverse').value='';calc()});ids.filter(id=>id!=='drug').forEach(id=>$(id).addEventListener('input',calc));calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
